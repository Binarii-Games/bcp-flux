name: Feature request
description: Propose a change or a capability for flux or common
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is a systems library, so correctness and clarity come before surface
        area. A proposal is most useful when it names the problem before the
        solution.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the library does not let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: What would you change, and how would a caller use it?
    validations:
      required: true
  - type: dropdown
    id: library
    attributes:
      label: Which library
      description: common carries transport-agnostic primitives. flux is the transport.
      options:
        - flux
        - common
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you looked at, and why they fall short.
