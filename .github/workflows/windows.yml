name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  msvc:
    uses: ./.github/workflows/build.yml
    with:
      os: windows-latest
      # MSVC AddressSanitizer conflicts with the /RTC1 flag CMake puts on
      # Debug builds, so this job runs without sanitizers for now.
      cmake: -DBCP_SANITIZE=
