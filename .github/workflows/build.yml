name: build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      container:
        type: string
        default: ''
      setup:
        type: string
        default: ''
      cmake:
        type: string
        default: ''
      buildonly:
        type: boolean
        default: false
      aslr:
        type: boolean
        default: false

jobs:
  run:
    runs-on: ${{ inputs.os }}
    container: ${{ inputs.container }}
    steps:
      - uses: actions/checkout@v4

      # Recent runner kernels raise ASLR entropy past what the sanitizer
      # runtimes handle, and instrumented binaries crash at startup.
      - name: lower aslr entropy
        if: ${{ inputs.aslr }}
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: install toolchain
        if: ${{ inputs.setup != '' }}
        run: ${{ inputs.setup }}

      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug ${{ inputs.cmake }}

      - name: build
        run: cmake --build build --config Debug --parallel 4

      - name: test
        if: ${{ !inputs.buildonly }}
        run: ctest --test-dir build -C Debug -LE "bench|acceptance" --output-on-failure
